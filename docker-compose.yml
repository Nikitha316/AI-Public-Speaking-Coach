version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./speech_coach.db
      - SECRET_KEY=production-secret-key-987654321
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/speech_coach.db:/app/speech_coach.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
